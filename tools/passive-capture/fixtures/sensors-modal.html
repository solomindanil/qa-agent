<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}.layout{display:flex;gap:32px}nav a{display:block;margin-top:8px}form{position:relative;width:360px;padding-top:48px}label{display:block;margin-top:8px}.zones{display:flex;gap:8px;margin-top:12px}.map{margin-top:12px;padding:8px;border:1px solid #888}input:not([type=radio],[type=checkbox]){padding:6px 10px;border:1px solid #888}</style></head><body><main><h1>Greenhouse sensors</h1><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16" alt=""><img id="chart" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="240" height="60"><div class="layout"><nav aria-label="Zones"><a href="#a">Zone A</a><a href="#b">Zone B</a><a href="#c">Zone C</a><a href="#d">Zone D</a></nav><form><div role="radiogroup"><span>Temperature unit</span><label><input type="radio" name="unit" value="c"> Celsius</label><label><input type="radio" name="unit" value="f"> Fahrenheit</label></div><div role="group" aria-labelledby="alert-heading"><p id="alert-h">Alert channels</p><label><input type="checkbox" name="alert" value="mail"> E-mail</label><label><input type="checkbox" name="alert" value="push"> Push</label></div><label for="humidity">Target humidity (%)</label><input id="humidity" type="number" tabindex="2"><label for="interval">Reading interval (min)</label><input id="interval" type="number"><div class="zones" dir="rtl"><button type="button">Zone 1</button><button type="button">Zone 2</button></div><div class="map" id="map" tabindex="0">Sensor map</div><button type="submit" id="save" style="position:absolute;top:0;right:0">Save settings</button></form></div></main><dialog id="cal"><h2>Calibrate sensor</h2><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16" alt=""><p>Reference</p><label><input type="radio" name="reference" value="dry"> Dry air</label><label><input type="radio" name="reference" value="salt"> Salt solution</label><button type="button">Start</button> <button type="button">Close</button></dialog><script>document.getElementById("cal").showModal()</script></body></html>
