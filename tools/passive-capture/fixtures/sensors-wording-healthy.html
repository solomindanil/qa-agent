<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}table.readings{border-collapse:collapse}table.readings th,table.readings td{padding:4px 12px;text-align:left}form{width:360px;margin-top:16px}p.setting{margin:8px 0}label{display:block}input{padding:6px 10px;border:1px solid #888}</style></head><body><main><h1>Greenhouse climate</h1><h2>Humidity and temperature</h2><table class="readings"><tr><th>Zone</th><th>Humidity</th><th>Temperature</th><th>Water</th></tr><tr><td>North</td><td>64 %</td><td>21 °C</td><td>Daily</td></tr><tr><td>South</td><td>58 %</td><td>23 °C</td><td>Daily</td></tr></table><p class="note">Humidity and temperature are read every hour.</p><p class="note">Water the beds when the soil is dry, or remind me later.</p><p class="actions"><button type="button">Water now</button></p><form aria-label="Climate settings"><p class="setting"><label for="humidity">Humidity (%)</label><input id="humidity" name="humidity" type="number"></p><p class="setting"><label for="temperature">Temperatur (°C)</label><input id="temperature" name="temperature" type="number"></p><p class="setting"><label for="night">Humidité de nuit (%)</label><input id="night" name="night_humidity" type="number"></p><p class="setting"><label for="interval">Water every (days)</label><input id="interval" name="water_interval" type="number"></p><p class="setting"><input name="q" type="search" aria-label="Search sensors"></p></form></main></body></html>
