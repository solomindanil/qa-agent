<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}.join-form{width:420px}.join-field{margin-top:10px}.join-field label{display:block;font-size:16px}.join-input{box-sizing:border-box;width:100%;font:inherit;padding:6px 8px;border:1px solid #888}.join-agree{display:block;margin-top:12px;font-size:14px}.join-go{font:inherit;margin-top:12px;padding:8px 14px;background:#1f3a5f;color:#fff;border:0}.site-footer{margin-top:32px;border-top:1px solid #ccc;padding-top:12px;font-family:Georgia,serif}.join-field small{display:block;font-size:13px;color:#555}.site-footer label{font-size:12px;margin-right:6px}.site-footer input{font-size:12px}.site-footer button{font-size:12px}</style></head><body><main><h1>Join the library</h1><form class="join-form"><div class="join-field"><label for="fullname">Name</label><input class="join-input" id="fullname" name="fullname"></div><div class="join-field"><label for="email">Email</label><input class="join-input" id="email" name="email"></div><div class="join-field"><label for="phone">Phone</label><input class="join-input" id="phone" name="phone"><small>Optional</small></div><div class="join-field"><label for="branch">Branch</label><input class="join-input" id="branch" name="branch"><small>Optional</small></div><div class="join-field"><label for="cardno">Card number</label><input class="join-input" id="cardno" name="cardno"></div><label class="join-agree"><input type="checkbox" id="agree" name="agree"> I agree to the loan terms</label><button type="submit" class="join-go">Join</button></form></main><footer class="site-footer"><label for="nl">Email</label><input id="nl" name="nl"> <button type="button">Sign up</button><p class="footer-note">Monthly reading list, <small>Optional</small></p><label for="pc">Postcode</label><input id="pc" name="pc"> <button type="button">Find a branch</button></footer></body></html>
