<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}form{width:420px}label{display:block;margin-top:8px}fieldset{margin-top:12px}.actions{display:flex;gap:8px;margin-top:12px}input:not([type=radio],[type=checkbox]){padding:6px 10px;border:1px solid #888}</style></head><body><main><h1>New loan</h1><img id="logo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="48" height="48" alt="Branch library logo"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16" alt=""><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16" aria-hidden="true"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16" role="presentation"><form><label for="patron">Patron card number</label><input id="patron"><fieldset><legend>Loan length</legend><label><input type="radio" name="loan-length" value="7"> 7 days</label><label><input type="radio" name="loan-length" value="14"> 14 days</label><label><input type="radio" name="loan-length" value="28"> 28 days</label></fieldset><div role="group" aria-labelledby="notify-h"><p id="notify-h">Remind the patron by</p><label><input type="checkbox" name="notify" value="mail"> E-mail</label><label><input type="checkbox" name="notify" value="sms"> SMS</label></div><label><input type="checkbox" name="terms"> Patron accepted the loan terms</label><div class="actions"><button type="submit" id="lend">Lend</button><button type="button" id="cancel">Cancel</button><a href="#help" id="help" tabindex="0">Help</a><span tabindex="-1">Saved</span></div></form></main><aside inert><h2>Archived loans</h2><button type="button" tabindex="4">Reopen</button><label><input type="radio" name="archived"> Lost</label><label><input type="radio" name="archived"> Returned</label><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="16" height="16"><div style="display:flex;flex-direction:row-reverse"><button type="button">First</button><button type="button">Second</button></div></aside></body></html>
