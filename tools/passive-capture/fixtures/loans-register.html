<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}form{width:420px;margin-bottom:24px}label{display:block;margin-top:8px}input,textarea{display:block;width:100%;box-sizing:border-box;padding:6px 10px;border:1px solid #888}button{margin-top:12px}</style></head><body><main>
<form id="register" aria-labelledby="register-title"><h1 id="register-title">Register patron</h1>
<label for="full-name">Full name</label><input id="full-name" name="fullName" maxlength="40" required autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="pin">Choose a PIN</label><input id="pin" name="pin" type="password" autocomplete="new-password">
<label for="notes">Notes</label><textarea id="notes" name="notes"></textarea>
<button type="submit">Register</button></form>
<form id="contact" aria-labelledby="contact-title"><h2 id="contact-title">Update contact details</h2>
<label for="contact-email">Email</label><input id="contact-email" name="contactEmail" type="email" autocomplete="email">
<label for="phone">Phone</label><input id="phone" name="phone" type="tel" inputmode="numeric">
<button type="submit">Save</button></form>
<form id="change-pin" aria-labelledby="change-title"><h2 id="change-title">Change PIN</h2>
<label for="patron-id">Patron number</label><input id="patron-id" name="patronId" readonly required>
<label for="card">Library card</label><input id="card" name="card" autocomplete="username" maxlength="14">
<label for="old-pin">Current PIN</label><input id="old-pin" name="oldPin" type="password" autocomplete="current-password" required>
<label for="new-pin">New PIN</label><input id="new-pin" name="newPin" type="password" autocomplete="new-password" required minlength="4">
<label for="branch">Branch</label><input id="branch" name="branch" disabled required>
<button type="submit">Change PIN</button></form>
</main></body></html>
