<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}.renew-form{width:420px}.renew-field{margin-top:10px}.renew-field label{display:block;font-size:15px}.renew-control{box-sizing:border-box;width:100%;font:inherit;padding:6px 8px;border:1px solid #888}.renew-field small{display:block;font-size:13px;color:#555}.renew-field small.renew-limit{font-family:Georgia,serif}.renew-more{font-family:"Apple Symbols","Segoe UI Symbol",serif;background:none;border:1px solid #888;margin-top:12px}.renew-go{font:inherit;margin-top:12px;padding:8px 14px;background:#1f3a5f;color:#fff;border:0}</style></head><body><main><h1>Renew loans</h1><form class="renew-form"><div class="renew-field"><label for="card">Library card</label><input class="renew-control" id="card" name="card"><small>Printed on the back of your card.</small></div><div class="renew-field"><label for="title">Book title</label><input class="renew-control" id="title" name="title"></div><div class="renew-field"><label for="weeks">Extra weeks</label><select class="renew-control" id="weeks" name="weeks"><option>1</option><option>2</option><option>3</option></select><small class="renew-limit">Up to three renewals per loan.</small></div><div class="renew-field"><label for="note">Note to the desk</label><textarea class="renew-control" id="note" name="note"></textarea></div><button type="button" class="renew-more">⋯</button> <button type="submit" class="renew-go">Renew loan</button></form></main></body></html>
