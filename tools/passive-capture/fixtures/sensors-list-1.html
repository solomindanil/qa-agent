<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}form{width:360px}.sensors{margin:12px 0;padding-left:40px}.sensor{margin-top:8px}.sensor label{display:block}.threshold{box-sizing:border-box;width:240px;padding:6px 10px;border:1px solid #888}.photos{display:flex;gap:8px}.note{font-size:13px;color:#555}</style></head><body><main><h1>Sensors: Propagation house</h1><div class="photos"><img class="photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="64" height="48" alt="Sensor P1 on the seed bench"><img class="photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="64" height="48" alt="Sensor P2 by the misting line"></div><form><ul class="sensors"><li class="sensor"><label for="p-air">Air temperature alert (°C)</label><input class="threshold" id="p-air" name="p-air" type="number"></li><li class="sensor"><label for="p-soil">Soil moisture alert (%)</label><input class="threshold" id="p-soil" name="p-soil" type="number"></li><li class="sensor"><label for="p-light">Light level alert (lux)</label><input class="threshold" id="p-light" name="p-light" type="number"></li></ul></form><p class="note">Changes are saved automatically.</p><div style="height:12000px"></div><img class="photo" loading="lazy" src="absent-archive.gif" width="64" height="48" alt="Archived sensor photo"></main></body></html>
