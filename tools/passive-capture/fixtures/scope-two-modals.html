<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}.grid{display:grid;grid-template-columns:repeat(3,200px);gap:16px}.card{border:1px solid #ccc;padding:12px}.card-title{font-size:16px;margin:0}form{width:320px}label{display:block;margin-top:8px}input{display:block;box-sizing:border-box;width:100%;padding:6px 10px;border:1px solid #888}</style></head><body><main><h1>Catalog</h1><div class="grid"><div class="card"><h5 class="card-title">Hammer</h5></div><div class="card"><h5 class="card-title">Pliers</h5></div><div class="card"><h5 class="card-title">Saw</h5></div><div class="card"><h5 class="card-title">Drill</h5></div><div class="card"><h5 class="card-title">Wrench</h5></div><div class="card"><h5 class="card-title" style="text-align:right">Chisel</h5></div></div></main><dialog id="a"><p>First in DOM, opened last</p><button type="button" class="a-icon"><svg width="16" height="16" aria-hidden="true"><rect width="16" height="16"/></svg></button></dialog><dialog id="b"><p>Second in DOM, opened first</p><button type="button" class="b-icon"><svg width="16" height="16" aria-hidden="true"><rect width="16" height="16"/></svg></button></dialog><script>document.getElementById("b").showModal();document.getElementById("a").showModal()</script></body></html>
