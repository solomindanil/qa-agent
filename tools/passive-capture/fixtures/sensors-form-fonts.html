<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}.probe-form{width:420px}.probe-field{margin-top:10px}.probe-field label{display:block}.probe-control{box-sizing:border-box;width:100%;font:inherit;padding:6px 8px;border:1px solid #888}.probe-code{font-family:ui-monospace,Menlo,monospace;font-size:14px}.probe-field small{display:block;font-size:13px;color:#555}.probe-actions button{font-family:"Trebuchet MS",sans-serif;margin-top:12px;padding:8px 14px}.probe-icon{font-family:"Apple Symbols","Segoe UI Symbol",serif;background:none;border:1px solid #888}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style></head><body><main><h1>Add a probe</h1><form class="probe-form"><div class="probe-field"><label for="probe">Probe name</label><input class="probe-control" id="probe" name="probe"><small>Shown on the bench display.</small></div><div class="probe-field"><label for="serial">Serial code</label><input class="probe-control probe-code" id="serial" name="serial"><small>Printed under the probe cap.</small></div><div class="probe-field"><label for="bench">Bench</label><select class="probe-control" id="bench" name="bench"><option>North</option><option>South</option></select><small>Where the probe is mounted.</small></div><div class="probe-field"><label for="interval">Reading interval</label><input class="probe-control" id="interval" name="interval" type="number"><button type="button" class="probe-icon">±</button> <button type="button" class="probe-icon" aria-label="Clear interval">✕</button> <button type="button" class="probe-icon">✎<span class="sr-only">Rename</span></button></div><div class="probe-actions"><button type="submit">Save probe</button> <button type="button">Cancel</button></div></form></main></body></html>
