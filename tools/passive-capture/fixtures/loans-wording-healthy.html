<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}ul.loan-list{list-style:none;padding:0}li.loan{margin-top:6px}span.book{display:inline-block;width:220px}form{width:420px;margin-top:16px}p.addr,p.find{margin:8px 0}label{display:block}input{padding:6px 10px;border:1px solid #888}</style></head><body><main><h1>Loans and returns</h1><nav class="sections" aria-label="Sections"><a href="#loans">Loans</a> <a href="#patrons">Patrons</a> <a href="#shelves">Shelves</a></nav><p class="intro">Return the loans of one patron at the desk.</p><ul class="loan-list"><li class="loan"><span class="book">Tides and Moons</span><button type="button">Return</button> <button type="button">Renew</button></li><li class="loan"><span class="book">Salt Roads</span><button type="button">Return</button> <button type="button">Renew</button></li><li class="loan"><span class="book">Paper Gardens</span><button type="button">Return</button> <button type="button">Renew</button></li><li class="loan"><span class="book">Quiet Engines</span><button type="button">Return</button> <button type="button">Renew</button></li><li class="loan"><span class="book">Northern Lights</span><button type="button">Return</button> <button type="button">Renew</button></li><li class="loan"><span class="book">Glass Rivers</span><button type="button">Return</button> <button type="button">Renew</button></li></ul><p class="note">A renewal adds two weeks to the loan period.</p><p class="actions"><button type="button">Return all</button> <button type="button">Return selected</button> <button type="button">Reset filters</button></p><h2>Returned items</h2><p class="shelving"><button type="button">Shelve</button> <button type="button">Shelve</button> <button type="button">Shelve</button></p><p class="note">Shelf labels print at the desk.</p><form aria-label="Patron address"><p class="addr"><label for="street">Street</label><input id="street" name="street"></p><p class="addr"><label for="city">City</label><input id="city" name="city"></p><p class="addr"><label for="county">County</label><input id="county" name="county"></p><p class="addr"><label for="country">Country</label><input id="country" name="country"></p><p class="addr"><label for="zip">Zip code</label><input id="zip" name="zip"></p><p class="addr"><label for="notes">Notes on the loan term</label><input id="notes" name="notes"></p><p class="addr"><label for="term">Loan term</label><input id="term" name="loan_term"></p></form><form aria-label="Find a loan"><p class="find"><label for="title">Title</label><input id="title" name="title"></p><p class="find"><label for="author">Author</label><input id="author" name="author"></p><p class="find"><label>Order by <select name="sort"><option>Title</option> <option>Author</option></select></label></p></form></main></body></html>
