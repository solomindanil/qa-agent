<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture</title><style>body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#222}form{width:360px}.sensors{margin:12px 0;padding-left:40px}.sensor{margin-top:8px}.sensor label{display:block}.threshold{box-sizing:border-box;width:240px;padding:6px 10px;border:1px solid #888}.photos{display:flex;gap:8px}.note{font-size:13px;color:#555}</style></head><body><main><h1>Sensors: Orchid house</h1><div class="photos"><img class="photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="64" height="48" alt="Sensor O1 above the orchid benches"><img class="photo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="64" height="48" alt="Sensor O2 near the vents"></div><form><ul class="sensors"><li class="sensor"><label for="o-air">Air temperature alert (°C)</label><input class="threshold" id="o-air" name="o-air" type="number"></li><li class="sensor"><label for="o-soil">Soil moisture alert (%)</label><input class="threshold" id="o-soil" name="o-soil" type="number"></li><li class="sensor"><label for="o-light">Light level alert (lux)</label><input class="threshold" id="o-light" name="o-light" type="number"></li></ul></form><p class="note">Changes are saved automatically.</p></main></body></html>
