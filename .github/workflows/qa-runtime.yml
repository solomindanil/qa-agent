name: QA runtime smoke

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix components/kernel
          npm ci --ignore-scripts --no-audit --no-fund --prefix components/console
      - name: Kernel build and contract controls
        working-directory: components/kernel
        run: |
          npm run typecheck
          npm run build
          ./node_modules/.bin/vitest run tests/contracts
      - name: Console typecheck and production build
        working-directory: components/console
        run: |
          ./node_modules/.bin/tsc --noEmit --incremental false
          ./node_modules/.bin/vite build
      - name: Isolated Console runtime controls
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-runtime.XXXXXX")"
          # Keep the fail-closed helper guard; remove runner-global Git helpers
          # only from this owned test environment, never from the host config.
          git config --show-origin --name-only --get-regexp '^(core\.(fsmonitor|hooksPath|sshCommand)|filter\.|include\.|includeIf\.|extensions\.|alias\.)' || test "$?" = 1
          env -i \
            PATH="${PATH}" \
            CI=true \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            TSX_DISABLE_CACHE=1 \
            NODE_DISABLE_COMPILE_CACHE=1 \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_CONSOLE_STATE="${qa_tmp}/receipts.json" \
            QA_CONSOLE_PRIVATE_ROOT="${qa_tmp}/private" \
            QA_REGISTRATION_STORE="${qa_tmp}/store" \
            QA_REGISTRATION_TARGET_REGISTRY="${qa_tmp}/targets.json" \
            node --import tsx --test --test-concurrency=1 \
              tests/unit/portable-entrypoints.test.ts \
              tests/unit/runtime-paths.test.ts \
              tests/unit/qa-product-skill.test.ts \
              tests/unit/kernel-fixture-authority.test.ts \
              tests/unit/api-semantic-assertions.test.ts \
              tests/unit/qa-campaign-files-umask.test.ts \
              tests/unit/campaign-plan-concurrency.test.ts \
              tests/unit/agent-observation-bridge.test.ts \
              tests/unit/agent-observation-view.test.ts \
              tests/unit/qa-agent-observation-cli.test.ts \
              tests/unit/qa-agent-observation-pair.test.ts \
              tests/unit/campaign-outcomes.test.ts \
              tests/unit/campaign-verdict-copy.test.ts \
              tests/unit/campaign-continuation-source-authority.test.ts \
              tests/unit/campaign-continuation-readback.test.mjs \
              tests/unit/campaign-continuation-readback-faults.test.mjs
      - name: Install isolated Chromium for local fixture checks
        working-directory: components/console
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-release-browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser healthy and broken fixture controls
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-browser.XXXXXX")"
          env -i \
            PATH="${PATH}" \
            TMPDIR="${qa_tmp}" \
            PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/qa-release-browsers" \
            node --import tsx --test tests/unit/browser-journey.test.ts tests/unit/public-input-campaign.test.ts
      - name: Verify source integrity after runtime checks
        run: node tools/workspace.mjs verify

  kernel-regression:
    name: Kernel failure diagnostics (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: workspace
            file: tests/workspace/regeneration.test.ts
            pattern: 'restores an applied delete from proven absence|applies B atomically|omits the state entry when publication semantics change'
          - group: job
            file: tests/registration/job.test.ts
            pattern: 'fails closed without deleting hostile phase selection fences|fails closed without deleting a substituted claim-receipt repair temp'
          - group: service
            file: tests/registration/service.test.ts
            pattern: 'retains a fenced validation output|retains a pre-existing init stage|resumes PUBLISHING over a safe prior-authority workspace'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install exact Kernel dependencies
        working-directory: components/kernel
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnose failures from the incomplete full regression
        working-directory: components/kernel
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-kernel.XXXXXX")"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            ./node_modules/.bin/vitest run "${{ matrix.file }}" -t "${{ matrix.pattern }}" --reporter=verbose
      - name: Verify source integrity after diagnostics
        if: always()
        run: node tools/workspace.mjs verify
