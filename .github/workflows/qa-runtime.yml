name: QA runtime smoke

on:
  pull_request:
  push:
    branches: [develop, codex/stable-20260926]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kernel-build: ${{ steps.selection.outputs.kernel-build }}
      kernel-full: ${{ steps.selection.outputs.kernel-full }}
      kernel-focused: ${{ steps.selection.outputs.kernel-focused }}
      console-build: ${{ steps.selection.outputs.console-build }}
      console-runtime: ${{ steps.selection.outputs.console-runtime }}
      console-browser: ${{ steps.selection.outputs.console-browser }}
      console-s01: ${{ steps.selection.outputs.console-s01 }}
      plan: ${{ steps.selection.outputs.plan }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Select verified CI impact
        id: selection
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-runtime-impact.XXXXXX")"
          env -i \
            PATH="${PATH}" \
            LANG=C.UTF-8 \
            GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            GITHUB_SHA="${GITHUB_SHA}" \
            GITHUB_REF="${GITHUB_REF}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            node tools/ci-impact.mjs --root "${GITHUB_WORKSPACE}" --event-file "${GITHUB_EVENT_PATH}" --workflow runtime --output "${qa_tmp}/selection.json"
          node - "${qa_tmp}/selection.json" <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const s = plan.selection;
          const flags = ['rootTests','freelandControls','kernelBuildContracts','kernelFull','consoleBuild','consoleRuntime','consoleS01Lifecycle'];
          if (plan.schemaVersion !== 1 || plan.qualification !== 'selection_only' || plan.workflow !== 'runtime' ||
              !s || flags.some(key => typeof s[key] !== 'boolean') || !['none','finite','all'].includes(s.consoleBrowser) ||
              !Array.isArray(s.kernelFocusedTests) || s.kernelFocusedTests.some(path => typeof path !== 'string' ||
                !/^tests\/(?:[^/]+\/)*[^/]+\.test\.ts$/.test(path) || /[\x00-\x20\\]/.test(path) ||
                path.split('/').some(part => part.startsWith('-') || part === '..' || part === '.')) ||
              !Array.isArray(plan.unsupportedChanges) || !plan.reasons || !plan.head || !plan.base ||
              [...flags,'kernelFocusedTests','consoleBrowser'].some(key => typeof plan.reasons[key] !== 'string')) throw Error('Invalid runtime selection');
          const outputs = {
            'kernel-build': s.kernelBuildContracts, 'kernel-full': s.kernelFull,
            'kernel-focused': JSON.stringify(s.kernelFocusedTests), 'console-build': s.consoleBuild,
            'console-runtime': s.consoleRuntime, 'console-browser': s.consoleBrowser,
            'console-s01': s.consoleS01Lifecycle, plan: JSON.stringify(plan)
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key,value]) => key + '=' + value).join('\n') + '\n');
          const rows = Object.entries(s).map(([key,value]) => key + ': ' + JSON.stringify(value) + ' — ' + plan.reasons[key]).join('\n');
          const summary = JSON.stringify({head: plan.head, base: plan.base, components: plan.components}) + '\n' + rows + '\n';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

  runtime-smoke:
    needs: impact
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      mode: ${{ steps.runtime-result.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install selected Kernel dependencies without lifecycle scripts
        if: needs.impact.outputs.kernel-build == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix components/kernel
      - name: Install selected Console dependencies without lifecycle scripts
        if: needs.impact.outputs.console-build == 'true' || needs.impact.outputs.console-runtime == 'true' || needs.impact.outputs.console-browser != 'none' || needs.impact.outputs.console-s01 == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix components/console
      - name: Kernel build and contract controls
        if: needs.impact.outputs.kernel-build == 'true'
        working-directory: components/kernel
        run: |
          npm run typecheck
          npm run build
          ./node_modules/.bin/vitest run tests/contracts
      - name: Console typecheck and production build
        if: needs.impact.outputs.console-build == 'true'
        working-directory: components/console
        run: |
          ./node_modules/.bin/tsc --noEmit --incremental false
          ./node_modules/.bin/tsc -p tsconfig.fixture-repair.json --noEmit --incremental false
          ./node_modules/.bin/vite build
      - name: Isolated Console runtime controls
        if: needs.impact.outputs.console-runtime == 'true'
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-runtime.XXXXXX")"
          # Keep the fail-closed helper guard; remove runner-global Git helpers
          # only from this owned test environment, never from the host config.
          git config --show-origin --name-only --get-regexp '^(core\.(fsmonitor|hooksPath|sshCommand)|filter\.|include\.|includeIf\.|extensions\.|alias\.)' || test "$?" = 1
          env -i \
            PATH="${PATH}" \
            CI=true \
            npm_config_offline=true \
            npm_config_yes=false \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            TSX_DISABLE_CACHE=1 \
            NODE_DISABLE_COMPILE_CACHE=1 \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_CONSOLE_STATE="${qa_tmp}/receipts.json" \
            QA_CONSOLE_PRIVATE_ROOT="${qa_tmp}/private" \
            QA_REGISTRATION_STORE="${qa_tmp}/store" \
            QA_REGISTRATION_TARGET_REGISTRY="${qa_tmp}/targets.json" \
            node --import tsx --test --test-concurrency=1 \
              tests/unit/portable-entrypoints.test.ts \
              tests/unit/runtime-paths.test.ts \
              tests/unit/qa-product-skill.test.ts \
              tests/unit/kernel-fixture-authority.test.ts \
              tests/unit/kernel-replace-authority.test.ts \
              tests/unit/bridge-cli-authority.test.ts \
              tests/unit/campaign-fixture-digests.test.ts \
              tests/unit/workspace-snapshot.test.ts \
              tests/unit/qa-outcomes-export.test.ts \
              tests/unit/request-admission.test.ts \
              tests/unit/agent-request-checkpoint.test.ts \
              tests/unit/agent-request-report.test.ts \
              tests/unit/agent-request-cli.test.ts \
              tests/unit/selected-agent-request.test.ts \
              tests/unit/qa-outcomes.test.ts \
              tests/unit/api-semantic-assertions.test.ts \
              tests/unit/qa-campaign-files-umask.test.ts \
              tests/unit/campaign-plan-concurrency.test.ts \
              tests/unit/agent-observation-bridge.test.ts \
              tests/unit/agent-observation-cli-reader.test.ts \
              tests/unit/agent-observation-view.test.ts \
              tests/unit/qa-agent-observation-cli.test.ts \
              tests/unit/qa-agent-observation-pair.test.ts \
              tests/unit/campaign-outcomes.test.ts \
              tests/unit/campaign-verdict-copy.test.ts \
              tests/unit/campaign-continuation-source-authority.test.ts \
              tests/unit/campaign-continuation-readback.test.mjs \
              tests/unit/campaign-continuation-readback-faults.test.mjs \
              tests/unit/selected-campaign-readback.test.mjs \
              tests/unit/selected-campaign-http.test.ts \
              tests/unit/selected-campaign-projection.test.ts \
              tests/unit/primary-ui-read-client.test.ts \
              tests/unit/primary-ui-selection.test.ts \
              tests/unit/primary-ui-projection.test.ts \
              tests/unit/primary-ui-report.test.ts \
              tests/unit/selected-campaign-consumer-lifecycle.test.mjs
      - name: Console runtime fixture compiler
        if: needs.impact.outputs.console-runtime == 'true' && needs.impact.outputs.console-build != 'true'
        working-directory: components/console
        run: ./node_modules/.bin/tsc -p tsconfig.fixture-repair.json --noEmit --incremental false
      - name: Finite browser no-output compiler
        if: needs.impact.outputs.console-browser != 'none'
        working-directory: components/console
        run: ./node_modules/.bin/tsc --noEmit --incremental false --target ES2022 --module ESNext --moduleResolution bundler --strict --skipLibCheck --lib ES2022,DOM,DOM.Iterable --types node tests/fixtures/browser-action-sequence/check.ts tests/unit/browser-action-sequence.test.ts
      - name: Exact affected Kernel tests
        if: needs.impact.outputs.kernel-focused != '[]'
        working-directory: components/kernel
        shell: bash
        env:
          KERNEL_FOCUSED: ${{ needs.impact.outputs.kernel-focused }}
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-kernel-focused.XXXXXX")"
          env -i PATH="${PATH}" CI=true LANG=C.UTF-8 TMPDIR="${qa_tmp}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null KERNEL_FOCUSED="${KERNEL_FOCUSED}" node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const paths = JSON.parse(process.env.KERNEL_FOCUSED);
          if (!Array.isArray(paths) || !paths.length || new Set(paths).size !== paths.length || paths.some(path =>
              typeof path !== 'string' || !/^tests\/(?:[^/]+\/)*[^/]+\.test\.ts$/.test(path) ||
              /[\x00-\x20\\]/.test(path) || path.split('/').some(part => part.startsWith('-') || part === '..' || part === '.') ||
              !fs.lstatSync(path).isFile() || fs.lstatSync(path).isSymbolicLink())) throw Error('Invalid exact Kernel test paths');
          const result = spawnSync('./node_modules/.bin/vitest', ['run', ...paths], { stdio: 'inherit', env: process.env });
          if (result.error || result.status !== 0) throw Error('Selected Kernel tests failed');
          NODE
      - name: Selected S01 owned lifecycle controls
        if: needs.impact.outputs.console-s01 == 'true'
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-s01.XXXXXX")"
          # Keep the fail-closed helper guard; remove runner-global Git helpers
          # only from this owned test environment, never from the host config.
          git config --show-origin --name-only --get-regexp '^(core\.(fsmonitor|hooksPath|sshCommand)|filter\.|include\.|includeIf\.|extensions\.|alias\.)' || test "$?" = 1
          env -i \
            PATH="${PATH}" \
            CI=true \
            npm_config_offline=true \
            npm_config_yes=false \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            TSX_DISABLE_CACHE=1 \
            NODE_DISABLE_COMPILE_CACHE=1 \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_CONSOLE_STATE="${qa_tmp}/receipts.json" \
            QA_CONSOLE_PRIVATE_ROOT="${qa_tmp}/private" \
            QA_REGISTRATION_STORE="${qa_tmp}/store" \
            QA_REGISTRATION_TARGET_REGISTRY="${qa_tmp}/targets.json" \
            node --import tsx --test --test-concurrency=1 \
              --test-name-pattern='^S01 owned lifecycle abort' tests/unit/nuanu-authored-revision.test.ts
      - name: Install isolated Chromium for local fixture checks
        if: needs.impact.outputs.console-browser != 'none'
        working-directory: components/console
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-release-browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Browser healthy and broken fixture controls
        id: browser-all
        if: needs.impact.outputs.console-browser == 'all'
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-browser.XXXXXX")"
          qa_source="$(git rev-parse HEAD)"
          qa_kernel="$(git -C "${GITHUB_WORKSPACE}/components/kernel" rev-parse HEAD)"
          printf 'request-dir=%s\nconsole-commit=%s\nkernel-commit=%s\n' "${qa_tmp}/selected-request" "${qa_source}" "${qa_kernel}" >> "${GITHUB_OUTPUT}"
          qa_chromium="$(env -i PATH="${PATH}" PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/qa-release-browsers" node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath());')"
          env -i \
            PATH="${PATH}" \
            TMPDIR="${qa_tmp}" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_SELECTED_RUN_UI_DIR="${qa_tmp}/selected-run" \
            QA_SELECTED_REQUEST_UI_DIR="${qa_tmp}/selected-request" \
            QA_CONSUMER_SOURCE_COMMIT="${qa_source}" \
            QA_PRIMARY_UI_CHROMIUM="${qa_chromium}" \
            PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/qa-release-browsers" \
            node --import tsx --test tests/unit/browser-journey.test.ts tests/unit/public-input-campaign.test.ts tests/unit/browser-action-sequence.test.ts tests/e2e/selected-campaign-local.test.mjs tests/e2e/selected-agent-request-local.test.mjs
      - name: Stage selected request evidence
        id: request-evidence
        if: always() && needs.impact.outputs.console-browser == 'all' && steps.browser-all.outcome != 'skipped'
        timeout-minutes: 1
        env:
          SELECTED_REQUEST_DIR: ${{ steps.browser-all.outputs.request-dir }}
          BROWSER_OUTCOME: ${{ steps.browser-all.outcome }}
          ROOT_SOURCE_COMMIT: ${{ github.sha }}
          CONSOLE_SOURCE_COMMIT: ${{ steps.browser-all.outputs.console-commit }}
          KERNEL_SOURCE_COMMIT: ${{ steps.browser-all.outputs.kernel-commit }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const runner = fs.realpathSync(process.env.RUNNER_TEMP);
          if (!path.isAbsolute(runner) || /[\x00-\x1f\x7f]/.test(runner) || runner !== process.env.RUNNER_TEMP ||
              !fs.lstatSync(runner).isDirectory()) throw new Error('invalid runner temp');
          const stage = fs.mkdtempSync(path.join(runner, 'qa-request-evidence.'));
          fs.chmodSync(stage, 0o700);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'path=' + stage + '\n');
          const names = ['command-1.json', 'command-2.json', 'command-3.json', 'consumer-evidence.json',
            'checkpoint1-download.md', 'request-desktop.png', 'graph-shadow.html', 'graph.png', 'coverage-shadow.html', 'coverage.png',
            'opened-blocker-1.png', 'opened-blocker-2.png', 'opened-blocker-3.png', 'opened-blocker-4.png', 'opened-blocker-5.png', 'opened-blocker-6.png',
            'opened-plan.html', 'disclosed-strategy.json', 'opened-plan.png', 'historical-checkpoint1.png', 'injected-failure-unavailable.png'];
          const manifest = { schemaVersion: 1, syntheticFixtureOnly: true,
            rootCommit: process.env.ROOT_SOURCE_COMMIT || null, consoleCommit: process.env.CONSOLE_SOURCE_COMMIT || null,
            kernelCommit: process.env.KERNEL_SOURCE_COMMIT || null, runId: process.env.GITHUB_RUN_ID || null,
            attempt: process.env.GITHUB_RUN_ATTEMPT || null, browserOutcome: process.env.BROWSER_OUTCOME || 'unknown',
            directoryStatus: 'refused', consumerLedger: 'missing', files: [], refusals: [] };
          const refuse = code => { if (!manifest.refusals.includes(code)) manifest.refusals.push(code); };
          for (const key of ['rootCommit', 'consoleCommit', 'kernelCommit']) if (!/^[a-f0-9]{40}$/.test(manifest[key] || '')) refuse('identity_unavailable');
          if (!/^[1-9][0-9]*$/.test(manifest.runId || '') || !/^[1-9][0-9]*$/.test(manifest.attempt || '')) refuse('run_identity_unavailable');
          const same = (a, b) => ['dev', 'ino', 'mode', 'nlink', 'size', 'mtimeMs', 'ctimeMs'].every(key => a[key] === b[key]);
          const source = process.env.SELECTED_REQUEST_DIR || '';
          let parent, parentStat, sourceStat, safe = false, total = 0;
          try {
            parent = path.dirname(source);
            if (!path.isAbsolute(source) || path.normalize(source) !== source || path.basename(source) !== 'selected-request' ||
                path.dirname(parent) !== runner || !/^qa-browser\.[A-Za-z0-9]{6}$/.test(path.basename(parent))) throw new Error('provenance');
            parentStat = fs.lstatSync(parent); sourceStat = fs.lstatSync(source);
            if (!parentStat.isDirectory() || !sourceStat.isDirectory() || fs.realpathSync(parent) !== parent || fs.realpathSync(source) !== source ||
                parent === stage || source === stage) throw new Error('provenance');
            safe = true; manifest.directoryStatus = 'owned';
          } catch { refuse('source_directory_unavailable_or_unsafe'); }
          const stableDirectory = () => {
            if (!same(parentStat, fs.lstatSync(parent)) || !same(sourceStat, fs.lstatSync(source)) ||
                fs.realpathSync(parent) !== parent || fs.realpathSync(source) !== source) throw new Error('directory_drift');
          };
          for (const name of names) {
            const entry = { name, status: 'missing' }; manifest.files.push(entry);
            if (!safe) continue;
            let fd;
            try {
              stableDirectory();
              const file = path.join(source, name); let before;
              try { before = fs.lstatSync(file); } catch (error) { if (error.code === 'ENOENT') continue; throw error; }
              if (!before.isFile() || before.nlink !== 1 || fs.realpathSync(file) !== file) throw new Error('unsafe_leaf');
              if (before.size > 16 * 1024 * 1024 || total + before.size > 64 * 1024 * 1024) throw new Error('payload_bound');
              fd = fs.openSync(file, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
              if (!same(before, fs.fstatSync(fd))) throw new Error('identity_drift');
              const buffer = Buffer.alloc(before.size + 1);
              let used = 0, count;
              while (used < buffer.length && (count = fs.readSync(fd, buffer, used, buffer.length - used, null)) > 0) used += count;
              const bytes = buffer.subarray(0, used);
              if (bytes.length !== before.size || !same(before, fs.fstatSync(fd)) || !same(before, fs.lstatSync(file))) throw new Error('identity_drift');
              stableDirectory();
              fs.writeFileSync(path.join(stage, name), bytes, { flag: 'wx', mode: 0o600 });
              total += bytes.length; entry.status = 'accepted'; entry.bytes = bytes.length;
              entry.sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
            } catch { entry.status = 'refused'; refuse('unsafe_or_changed_payload'); }
            finally { if (fd !== undefined) fs.closeSync(fd); }
          }
          manifest.consumerLedger = manifest.files.find(entry => entry.name === 'consumer-evidence.json').status;
          manifest.totalBytes = total;
          if (manifest.browserOutcome === 'success' && manifest.files.some(entry => entry.status !== 'accepted')) refuse('successful_browser_evidence_incomplete');
          const encoded = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
          if (encoded.length > 1024 * 1024) throw new Error('manifest bound');
          fs.writeFileSync(path.join(stage, 'manifest.json'), encoded, { flag: 'wx', mode: 0o600 });
          if (manifest.refusals.length) throw new Error('selected request evidence retention refused');
          NODE
      - name: Upload selected request evidence
        if: always() && steps.request-evidence.outputs.path != ''
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selected-request-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.request-evidence.outputs.path }}
          retention-days: 14
          compression-level: 0
          archive: true
          overwrite: false
          include-hidden-files: false
          if-no-files-found: error
      - name: Finite browser fixture controls
        if: needs.impact.outputs.console-browser == 'finite'
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-browser.XXXXXX")"
          env -i \
            PATH="${PATH}" \
            TMPDIR="${qa_tmp}" \
            PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/qa-release-browsers" \
            node --import tsx --test tests/unit/browser-action-sequence.test.ts
      - name: Explicit unselected runtime result
        if: needs.impact.outputs.kernel-build != 'true' && needs.impact.outputs.console-build != 'true' && needs.impact.outputs.console-runtime != 'true' && needs.impact.outputs.console-browser == 'none' && needs.impact.outputs.console-s01 != 'true'
        run: echo 'NOT RUN — no runtime effects selected; root source packaging is qualified separately'
      - name: Record actual selected runtime completion
        id: runtime-result
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const materializedPlan = ${{ toJSON(needs.impact.outputs.plan) }};
          if (typeof materializedPlan !== 'string' || Buffer.byteLength(materializedPlan) > 1024 * 1024) throw Error('Selection plan exceeds materialization bound');
          const s = JSON.parse(materializedPlan).selection;
          const selected = s.kernelBuildContracts || s.consoleBuild || s.consoleRuntime || s.consoleBrowser !== 'none' || s.consoleS01Lifecycle || s.kernelFocusedTests.length;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'mode=' + (selected ? 'selected-complete' : 'explicit-no-tests') + '\n');
          NODE
      - name: Verify source integrity after runtime checks
        if: always()
        run: node tools/workspace.mjs verify

  console-dependency-intake:
    needs: impact
    if: needs.impact.outputs.console-runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      mode: ${{ steps.dependency-result.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install exact dependency intake Kernel dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix components/kernel
      - name: Install exact dependency intake Console dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix components/console
      - name: Install dependency intake Chromium
        working-directory: components/console
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-dependency-browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Isolated dependency intake controls
        working-directory: components/console
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-dependency-intake.XXXXXX")"
          git config --show-origin --name-only --get-regexp '^(core\.(fsmonitor|hooksPath|sshCommand)|filter\.|include\.|includeIf\.|extensions\.|alias\.)' || test "$?" = 1
          env -i \
            PATH="${PATH}" \
            CI=true \
            npm_config_offline=true \
            npm_config_yes=false \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            TSX_DISABLE_CACHE=1 \
            NODE_DISABLE_COMPILE_CACHE=1 \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_CONSOLE_STATE="${qa_tmp}/receipts.json" \
            QA_CONSOLE_PRIVATE_ROOT="${qa_tmp}/private" \
            QA_REGISTRATION_STORE="${qa_tmp}/store" \
            QA_REGISTRATION_TARGET_REGISTRY="${qa_tmp}/targets.json" \
            PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/qa-dependency-browsers" \
            node --import tsx --test --test-concurrency=1 \
              tests/unit/intake-build.test.ts \
              tests/unit/qa-init-cli.test.ts \
              tests/unit/campaign-dependency-scope.test.ts \
              tests/unit/campaign-dependency-adapter.test.ts \
              tests/unit/campaign-dependency-cli.test.ts
      - name: Verify dependency intake source integrity
        if: always()
        run: node tools/workspace.mjs verify
      - name: Record dependency intake completion
        id: dependency-result
        run: echo 'mode=selected-complete' >> "$GITHUB_OUTPUT"

  kernel-regression:
    needs: impact
    if: needs.impact.outputs.kernel-full == 'true'
    name: Full Kernel regression (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [workspace, service, remaining]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify pinned components
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install exact Kernel dependencies
        working-directory: components/kernel
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete disjoint Kernel test group
        working-directory: components/kernel
        shell: bash
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-kernel.XXXXXX")"
          # These three groups are disjoint and exhaust the normal collection.
          case "${{ matrix.group }}" in
            workspace) set -- tests/workspace/regeneration.test.ts ;;
            service) set -- tests/registration/service.test.ts ;;
            remaining) set -- --exclude tests/workspace/regeneration.test.ts --exclude tests/registration/service.test.ts ;;
            *) exit 1 ;;
          esac
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            npm test -- "$@" --reporter=verbose
      - name: Verify source integrity after full regression
        if: always()
        run: node tools/workspace.mjs verify

  runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [impact, runtime-smoke, kernel-regression, console-dependency-intake]
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Validate selection and selected job results
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          RUNTIME_RESULT: ${{ needs.runtime-smoke.result }}
          KERNEL_RESULT: ${{ needs.kernel-regression.result }}
          KERNEL_BUILD: ${{ needs.impact.outputs.kernel-build }}
          KERNEL_FULL: ${{ needs.impact.outputs.kernel-full }}
          KERNEL_FOCUSED: ${{ needs.impact.outputs.kernel-focused }}
          CONSOLE_BUILD: ${{ needs.impact.outputs.console-build }}
          CONSOLE_RUNTIME: ${{ needs.impact.outputs.console-runtime }}
          CONSOLE_BROWSER: ${{ needs.impact.outputs.console-browser }}
          CONSOLE_S01: ${{ needs.impact.outputs.console-s01 }}
          RUNTIME_MODE: ${{ needs.runtime-smoke.outputs.mode }}
          DEPENDENCY_RESULT: ${{ needs.console-dependency-intake.result }}
          DEPENDENCY_MODE: ${{ needs.console-dependency-intake.outputs.mode }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (process.env.IMPACT_RESULT !== 'success') throw Error('Impact selection failed or unavailable');
          const materializedPlan = ${{ toJSON(needs.impact.outputs.plan) }};
          if (typeof materializedPlan !== 'string' || Buffer.byteLength(materializedPlan) > 1024 * 1024) throw Error('Selection plan exceeds materialization bound');
          const plan = JSON.parse(materializedPlan);
          const s = plan.selection;
          const flags = ['rootTests','freelandControls','kernelBuildContracts','kernelFull','consoleBuild','consoleRuntime','consoleS01Lifecycle'];
          if (plan.schemaVersion !== 1 || plan.qualification !== 'selection_only' || plan.workflow !== 'runtime' ||
              !s || flags.some(key => typeof s[key] !== 'boolean') || !['none','finite','all'].includes(s.consoleBrowser) ||
              !Array.isArray(s.kernelFocusedTests) || !Array.isArray(plan.unsupportedChanges) || plan.unsupportedChanges.length ||
              !plan.head || !plan.base || !plan.reasons || [...flags,'kernelFocusedTests','consoleBrowser'].some(key => typeof plan.reasons[key] !== 'string')) throw Error('Incomplete/unsupported CI selection');
          if (process.env.RUNTIME_RESULT !== 'success') throw Error('Runtime job failed, cancelled or missing (including required source readback)');
          const outputs = {KERNEL_BUILD: String(s.kernelBuildContracts), KERNEL_FULL: String(s.kernelFull),
            KERNEL_FOCUSED: JSON.stringify(s.kernelFocusedTests), CONSOLE_BUILD: String(s.consoleBuild),
            CONSOLE_RUNTIME: String(s.consoleRuntime), CONSOLE_BROWSER: s.consoleBrowser, CONSOLE_S01: String(s.consoleS01Lifecycle)};
          if (Object.entries(outputs).some(([key,value]) => process.env[key] !== value)) throw Error('Missing or contradictory selection outputs');
          const selected = s.kernelBuildContracts || s.consoleBuild || s.consoleRuntime || s.consoleBrowser !== 'none' || s.consoleS01Lifecycle || s.kernelFocusedTests.length;
          if (process.env.RUNTIME_MODE !== (selected ? 'selected-complete' : 'explicit-no-tests')) throw Error('Missing/contradictory explicit runtime completion');
          if (s.kernelFull ? process.env.KERNEL_RESULT !== 'success' : process.env.KERNEL_RESULT !== 'skipped') throw Error('Kernel job contradicts selected plan');
          if (s.consoleRuntime ? process.env.DEPENDENCY_RESULT !== 'success' || process.env.DEPENDENCY_MODE !== 'selected-complete' :
              process.env.DEPENDENCY_RESULT !== 'skipped' || Boolean(process.env.DEPENDENCY_MODE)) throw Error('Dependency intake job contradicts selected plan or completion');
          console.log('dependency intake: ' + (s.consoleRuntime ? 'selected runtime results successful' : 'NOT RUN — unselected job skipped'));
          const rows = Object.entries(s).map(([key,value]) => key + ': ' +
            (['rootTests','freelandControls'].includes(key) ? 'separate source workflow; not asserted here — ' :
              value === false || value === 'none' || Array.isArray(value) && !value.length ? 'NOT RUN — ' : 'selected runtime results successful — ') +
            plan.reasons[key]).join('\n') + '\n';
          console.log(rows);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows);
          NODE
