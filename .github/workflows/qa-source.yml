name: QA source safety

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  source-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Restore selected bundled sources
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-source-restore.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node tools/workspace.mjs restore

      - name: Verify selected sources without repair
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-source-verify.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node tools/workspace.mjs verify


      - name: Select verified CI impact
        id: impact
        timeout-minutes: 3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-source-impact.XXXXXX")"
          env -i \
            PATH="${PATH}" \
            LANG=C.UTF-8 \
            GITHUB_TOKEN="${GITHUB_TOKEN}" \
            GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME}" \
            GITHUB_SHA="${GITHUB_SHA}" \
            GITHUB_REF="${GITHUB_REF}" \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            node tools/ci-impact.mjs --root "${GITHUB_WORKSPACE}" --event-file "${GITHUB_EVENT_PATH}" --workflow source --output "${qa_tmp}/selection.json"
          node - "${qa_tmp}/selection.json" <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const selection = plan.selection;
          if (plan.schemaVersion !== 1 || plan.qualification !== 'selection_only' || plan.workflow !== 'source' ||
              !selection || typeof selection.rootTests !== 'boolean' || typeof selection.freelandControls !== 'boolean' ||
              !Array.isArray(plan.unsupportedChanges) || !plan.reasons || !plan.head || !plan.base ||
              ['rootTests','freelandControls'].some(key => typeof plan.reasons[key] !== 'string')) throw Error('Invalid source selection');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'root-tests=' + selection.rootTests + '\nfreeland-controls=' + selection.freelandControls + '\n');
          const rows = Object.entries(selection).map(([key, value]) => key + ': ' + JSON.stringify(value) + ' — ' + plan.reasons[key]).join('\n');
          const summary = 'selection_only: this job executes root/Freeland source controls only; other flags describe separate runtime scope\n' + plan.reasons.event + '\n' + JSON.stringify({head: plan.head, base: plan.base, components: plan.components, duplicate: plan.duplicate}) + '\n' + rows + '\n';
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          if (plan.unsupportedChanges.length) throw Error('Unsupported changes: ' + plan.unsupportedChanges.join('; '));
          NODE

      - name: Run root packaging tests
        if: steps.impact.outputs.root-tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-root-tests.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node --test tests/*.test.mjs

      - name: Verify selected Freeland provenance
        if: steps.impact.outputs.freeland-controls == 'true'
        working-directory: components/freeland
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-freeland-provenance.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node tools/freeland-main/provenance.mjs --verify .

      - name: Run selected Freeland PAY01 pure oracle tests
        if: steps.impact.outputs.freeland-controls == 'true'
        working-directory: components/freeland
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-freeland-oracles.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node --test tests/product-graph/freeland-pay-01-oracle.test.mjs

      - name: Run selected Freeland verdict generation snapshot tests
        if: steps.impact.outputs.freeland-controls == 'true'
        working-directory: components/freeland
        shell: bash
        run: |
          set -euo pipefail
          qa_umask="$(umask)"
          umask 077
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo "RUNNER_TEMP must be absolute" >&2; exit 1 ;;
          esac
          qa_tmp="$(mktemp -d "${RUNNER_TEMP}/qa-freeland-verdict-snapshots.XXXXXX")"
          umask "${qa_umask}"
          env -i \
            PATH="${PATH}" \
            CI=true \
            LANG=C.UTF-8 \
            TMPDIR="${qa_tmp}" \
            node --test tests/freeland-main/verdict-generation-snapshots.test.mjs
