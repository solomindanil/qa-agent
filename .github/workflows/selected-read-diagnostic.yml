name: Selected request read diagnostic only

on:
  push:
    branches: [codex/selected-read-diagnostic-31ba]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Restore and verify unchanged selected sources
        run: |
          node tools/workspace.mjs restore
          node tools/workspace.mjs verify
      - name: Install exact selected dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix components/kernel
          npm ci --ignore-scripts --no-audit --no-fund --prefix components/console
      - name: Build public Kernel API without test execution
        working-directory: components/kernel
        run: npm run build
      - name: ONE newly labelled fixture and three finite read probes
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          qa_diag="$(mktemp -d "${RUNNER_TEMP}/qa-selected-read-diagnostic.XXXXXX")"
          env -i PATH="${PATH}" LANG=C.UTF-8 \
            QA_DIAGNOSTIC_DIR="${qa_diag}" \
            QA_CONSOLE_ROOT="${GITHUB_WORKSPACE}/components/console" \
            QA_STARTER_REPO="${GITHUB_WORKSPACE}/components/kernel" \
            QA_STARTER_EXPECTED_SHA=794e9fbae372ebf1fe8261556ec1ea0a4bceab26 \
            TSX_DISABLE_CACHE=1 TMPDIR="${qa_diag}" \
            node tools/selected-request-read-diagnostic.mjs
      - name: Verify unchanged source after diagnosis
        if: always()
        run: node tools/workspace.mjs verify
